name: Build & Push Backend Container Image

# Builds the API into a Docker image and pushes it to GitHub Container Registry (free for public packages) -
# Azure Container Apps then pulls from there. No local Docker needed; GitHub's runners do the build.
on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container-build.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase, not derived from github.repository - Docker image references must be all-lowercase
  # and this repo's actual name (HospitalManagementSystem) isn't, which fails the tag immediately.
  IMAGE_NAME: nareshkumar151/hms-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
